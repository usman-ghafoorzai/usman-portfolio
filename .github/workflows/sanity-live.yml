name: Sanity live health

on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1' # Weekly on Monday at 08:17 UTC

permissions:
  contents: read

jobs:
  live-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SANITY_LIVE_PARITY: '1'
      SANITY_LIVE_PROJECT_ID: 19bhyjyc
      SANITY_LIVE_DATASET: production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify published Sanity parity
        run: npm run test:live-sanity
